name: Check, test and publish

on:
  push:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pycodestyle==2.14.0
          playwright install --with-deps

      - name: Check Python code style
        run: pycodestyle src

      - name: Start application
        env:
          NBANK_BACKEND_IMAGE: nobugsme/nbank:with_fraud_check_with_transfer_fix
        run: |
          docker compose -f infra/docker-compose/docker-compose.yaml up -d

          for attempt in {1..60}; do
            if curl -sf http://localhost:4111/actuator/health >/dev/null; then
              echo "Backend is UP"
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy" >&2
          docker compose -f infra/docker-compose/docker-compose.yaml logs --tail=100
          exit 1

      - name: Run API tests
        env:
          DB_HOST: localhost
        run: |
          rm -rf coverage-results
          mkdir -p coverage-results/.history
          pytest -m api --api-version with_fraud_check -q \
            --alluredir=allure-results \
            --clean-alluredir

      - name: Run UI tests
        env:
          UI_BASE_URL: http://localhost:3000
        run: |
          pytest -m ui -q \
            --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.14
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: gh-pages

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      - name: Generate Swagger coverage report
        if: always()
        run: swagger-coverage-tool save-report

      - name: Stop application
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.yaml down

      - name: Upload Swagger coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage-report
          path: coverage-results/
          if-no-files-found: warn

      - name: Build Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nbank-tests:${{ github.sha }}
        run: docker build --tag "$IMAGE" .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nbank-tests:${{ github.sha }}
        run: docker push "$IMAGE"
