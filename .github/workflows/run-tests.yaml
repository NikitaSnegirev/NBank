name: Run tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        type: choice
        options:
          - api
          - ui
          - api+ui
      markers:
        description: "Additional pytest markers"
        required: false
        default: ""
      backend_tag:
        description: "Docker image tag for backend (e.g. with_database_with_fix, with_fraud_check)"
        required: true
        type: string
        default: ""
  push:
    branches: [main, master, run-tests]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          # Новый requirements.txt создает новый ключ кеша.
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Start services
        env:
          BACKEND_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_tag || 'with_fraud_check_with_transfer_fix' }}
          TEST_IMAGE: niko7645/nbank-tests:v1
        run: |
          export NBANK_BACKEND_IMAGE="nobugsme/nbank:${BACKEND_TAG}"
          docker compose -f infra/docker-compose/docker-compose.yaml up -d
          for i in {1..60}; do
            if curl -sf http://localhost:4111/actuator/health >/dev/null; then
              echo "Backend is UP"
              break
            fi
          sleep 2
          done 
          curl -sf http://localhost:4111/actuator/health

      - name: Run pytest
        env:
          UI_BASE_URL: http://localhost:3000
          DB_HOST: localhost
          # При push inputs нет — подставляем значения по умолчанию.
          SUITE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'api' }}
          MARKERS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.markers || '' }}
        run: |
          set -eux

          SUITE_INPUT="${SUITE_INPUT:-api}"
          MARKERS="${MARKERS_INPUT:-}"

          run_suite() {
            local suite="$1"
            local marker_expression="$suite"

            if [ -n "$MARKERS" ]; then
              marker_expression="($suite) and ($MARKERS)"
            fi

            pytest -m "$marker_expression" -q
          }

          case "$SUITE_INPUT" in
            api)
              run_suite api
              ;;
            ui)
              run_suite ui
              ;;
            api+ui)
              run_suite api
              run_suite ui
              ;;
            *)
              echo "Unknown suite: $SUITE_INPUT" >&2
              exit 2
              ;;
          esac

      - name: Shutdown
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.yaml down
